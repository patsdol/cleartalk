<div class="app">

<script>
const names={dashboard:'ภาพรวม',check:'ตรวจสอบข้อความ',history:'ประวัติการตรวจสอบ',guide:'คู่มือการใช้งาน',manage:'จัดการคำไม่เหมาะสม',settings:'ตั้งค่าระบบ',login:'เข้าสู่ระบบ',register:'สมัครสมาชิก'};
const sampleRows=[['CT-250316-0842','วันนี้ 10:42','ความคิดเห็นนี้ดีมาก ขอบคุณที่แบ่งปัน!','ทั่วไป','เรียบร้อย'],['CT-250316-0838','วันนี้ 10:18','อย่ามายุ่งกับฉันอีกเลย','ความก้าวร้าว','ควรตรวจสอบ'],['CT-250316-0821','วันนี้ 09:56','ขอให้เป็นวันที่ดีนะทุกคน','ทั่วไป','เรียบร้อย'],['CT-250315-0795','เมื่อวาน 16:32','คำพูดหยาบคายและดูหมิ่นคนอื่น','คำหยาบคาย','พบคำไม่เหมาะสม'],['CT-250315-0764','เมื่อวาน 14:08','ไม่เห็นด้วยกับแนวคิดนี้ เพราะ...','ความก้าวร้าว','เรียบร้อย']];
let page=new URLSearchParams(location.search).get('page')||'dashboard',records=[...sampleRows],words=[['หยาบคาย','ความรุนแรงทางภาษา','สูง','ใช้งาน'],['โง่','ดูหมิ่น','ปานกลาง','ใช้งาน'],['ไอ้บ้า','ดูหมิ่น','ปานกลาง','ใช้งาน'],['ข่มขู่','ความรุนแรง','สูง','ใช้งาน'],['สแปม','สแปม','ต่ำ','ใช้งาน'],['เหี้ย','คำหยาบคาย','สูง','ใช้งาน'],['ไอ้เหี้ย','คำดูหมิ่น','สูง','ใช้งาน'],['สัส','คำหยาบคาย','สูง','ใช้งาน'],['สัด','คำหยาบคาย','สูง','ใช้งาน'],['ควย','คำหยาบคาย','สูง','ใช้งาน'],['หี','คำหยาบคาย','สูง','ใช้งาน'],['เย็ด','คำหยาบคาย','สูง','ใช้งาน'],['แม่ง','คำหยาบคาย','ปานกลาง','ใช้งาน'],['ชิบหาย','คำหยาบคาย','สูง','ใช้งาน'],['ฉิบหาย','คำหยาบคาย','สูง','ใช้งาน'],['ระยำ','คำดูหมิ่น','สูง','ใช้งาน'],['ไอ้โง่','คำดูหมิ่น','ปานกลาง','ใช้งาน'],['อีดอก','คำดูหมิ่น','สูง','ใช้งาน'],['ดอกทอง','คำดูหมิ่น','สูง','ใช้งาน'],['สวะ','คำดูหมิ่น','สูง','ใช้งาน']];if(!['dashboard','check','history','guide','manage','settings'].includes(page))page='dashboard';
function shell(content){return `<div class="content">${content}</div>`}
function head(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function status(label){let c=label==='เรียบร้อย'?'clean':label==='ควรตรวจสอบ'?'review':'flag';return `<span class="status ${c}">${label}</span>`}
function tableRows(rows){return rows.map(r=>`<tr><td style="color:#8b91a4">${r[0]}</td><td>${r[1]}</td><td class="text-cell" title="${r[2]}">${r[2]}</td><td>${r[3]}</td><td>${status(r[4])}</td><td><button class="button secondary" style="padding:6px 9px;font-size:9px" onclick="showToast('เปิดรายละเอียด ${r[0]}')">ดู</button></td></tr>`).join('')}
function table(rows){return `<table class="table"><thead><tr><th>รหัสรายการ</th><th>วันที่ / เวลา</th><th>ข้อความ</th><th>หมวดหมู่</th><th>ผลการตรวจ</th><th></th></tr></thead><tbody>${tableRows(rows)}</tbody></table>`}
function dashboard(){return shell(head('ภาพรวมระบบ','สวัสดี, <span id="greetingName">ผู้ใช้</span> 👋','นี่คือสรุปการตรวจสอบข้อความในระบบของคุณ',`<button class="button primary" onclick="navigate('check')">＋ ตรวจสอบข้อความ</button>`)+`<section class="grid stats">${[['ข้อความที่ตรวจสอบ','1,284','↗ 12.8% จากเดือนที่แล้ว','purple','▤'],['พบคำไม่เหมาะสม','96','↘ 4.2% จากเดือนที่แล้ว','pink','⚑'],['ผ่านการตรวจสอบ','1,105','↗ 8.3% จากเดือนที่แล้ว','green','✓'],['รอตรวจสอบ','23','ต้องการการตรวจสอบ','orange','◷']].map(x=>`<div class="card"><div class="stat-top"><span>${x[0]}</span><span class="stat-icon ${x[3]}">${x[4]}</span></div><div class="stat-value">${x[1]}</div><div class="stat-foot"><span class="${x[0]==='พบคำไม่เหมาะสม'?'down':'up'}">${x[2].split(' ')[0]} ${x[2].split(' ')[1]}</span> ${x[2].split(' ').slice(2).join(' ')}</div></div>`).join('')}</section><section class="grid dashboard-grid"><div class="card"><div class="card-title"><div><h3>ปริมาณการตรวจสอบ</h3><p>แนวโน้มข้อความที่ตรวจสอบในช่วงเวลาที่เลือก</p></div><select class="select"><option>7 วันที่ผ่านมา</option><option>30 วันที่ผ่านมา</option></select></div><div class="chart"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7968e8" stop-opacity=".18"/><stop offset="1" stop-color="#7968e8" stop-opacity="0"/></linearGradient></defs><path d="M0 130 C40 120 50 90 95 100 S145 135 190 92 S245 82 285 96 S340 48 380 66 S430 100 475 48 S540 52 600 19 L600 180 L0 180Z" fill="url(#fill)"/><path d="M0 130 C40 120 50 90 95 100 S145 135 190 92 S245 82 285 96 S340 48 380 66 S430 100 475 48 S540 52 600 19" fill="none" stroke="#7564e2" stroke-width="3" vector-effect="non-scaling-stroke"/><path d="M0 153 C50 145 62 133 100 140 S150 155 195 127 S245 142 290 121 S340 126 385 112 S440 132 480 104 S545 116 600 88" fill="none" stroke="#f0b251" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/></svg></div><div class="chart-labels"><span>จ. 10</span><span>อ. 11</span><span>พ. 12</span><span>พฤ. 13</span><span>ศ. 14</span><span>ส. 15</span><span>อา. 16</span></div><div class="chart-legend" style="margin-top:15px"><span><i class="dot"></i>ตรวจสอบทั้งหมด</span><span><i class="dot orange"></i>พบคำไม่เหมาะสม</span></div></div><div class="card"><div class="card-title"><div><h3>ผลการตรวจสอบ</h3><p>สัดส่วนผลการตรวจในเดือนนี้</p></div><button class="select">เดือนนี้ ⌄</button></div><div class="donut-wrap"><div class="donut"><div class="donut-center"><strong>1,284</strong><small>รายการทั้งหมด</small></div></div><div class="legend-list"><div class="legend-item"><i class="dot"></i>ผ่าน 54%</div><div class="legend-item"><i class="dot" style="background:#76cfa7"></i>ไม่พบคำเสี่ยง 27%</div><div class="legend-item"><i class="dot orange"></i>ควรตรวจสอบ 13%</div><div class="legend-item"><i class="dot" style="background:#eeeef4"></i>อื่น ๆ 6%</div></div></div></div></section><section class="card recent"><div class="card-title"><div><h3>รายการตรวจสอบล่าสุด</h3><p>กิจกรรมล่าสุดในระบบของคุณ</p></div><button class="button soft" onclick="navigate('history')">ดูประวัติทั้งหมด →</button></div>${table(records.slice(0,4))}</section>`)}
function checkPage(){return shell(head('ตรวจสอบข้อความ','ตรวจสอบคำไม่เหมาะสม','วิเคราะห์ข้อความเพื่อค้นหาคำเสี่ยงและน้ำเสียงที่อาจไม่เหมาะสม')+`<div class="workspace"><section class="panel"><h3>ข้อความที่ต้องการตรวจสอบ</h3><p class="panel-sub">วางข้อความหรือพิมพ์ข้อความที่นี่ ระบบจะช่วยวิเคราะห์ให้คุณ</p><div class="tabrow"><button class="tab active" onclick="setInputMode(this,'text')">✎ ข้อความ</button><button class="tab" onclick="setInputMode(this,'url')">↗ ลิงก์ URL</button></div><textarea class="textarea" id="message" maxlength="2000" placeholder="พิมพ์หรือวางข้อความที่ต้องการตรวจสอบ...\n\nตัวอย่าง: ความคิดเห็นหรือโพสต์ที่ต้องการตรวจสอบ"></textarea><div class="input-foot"><span>ข้อมูลของคุณจะถูกเก็บเป็นส่วนตัว</span><span><b id="charCount">0</b> / 2,000 ตัวอักษร</span></div><div style="font-size:10px;font-weight:600;color:#656c81">ตัวเลือกการตรวจสอบ</div><div class="checks"><label class="check-chip"><input type="checkbox" checked> คำหยาบคาย</label><label class="check-chip"><input type="checkbox" checked> คำดูหมิ่น</label><label class="check-chip"><input type="checkbox" checked> ความรุนแรง</label><label class="check-chip"><input type="checkbox"> สแปม</label><label class="check-chip"><input type="checkbox"> ตรวจจับน้ำเสียง</label></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button class="button secondary" onclick="document.getElementById('message').value='';document.getElementById('charCount').textContent='0';document.getElementById('result').classList.remove('show')">ล้างข้อความ</button><button class="button primary" onclick="analyze()">✦ วิเคราะห์ข้อความ</button></div><div class="result-preview" id="result"></div></section><aside class="workspace-aside"><div class="aside-card"><h4>💡 เคล็ดลับการใช้งาน</h4><div class="tip"><div class="tip-icon">✦</div><span>วางข้อความที่ต้องการตรวจสอบในช่องด้านซ้าย แล้วกด “วิเคราะห์ข้อความ”</span></div><div class="tip"><div class="tip-icon">◎</div><span>เลือกหมวดหมู่เพื่อให้ระบบตรวจสอบเฉพาะสิ่งที่คุณสนใจ</span></div><div class="tip"><div class="tip-icon">♧</div><span>ผลลัพธ์เป็นคำแนะนำ ควรใช้ดุลยพินิจในการพิจารณา</span></div></div><div class="aside-card"><h4>สรุปวันนี้</h4><div class="activity-row"><span>ตรวจสอบแล้ว</span><b>18 ข้อความ</b></div><div class="activity-row"><span>พบคำเสี่ยง</span><b style="color:#dc7777">3 รายการ</b></div><div class="activity-row"><span>คงเหลือวันนี้</span><b>ไม่จำกัด</b></div></div></aside></div>`)}
function historyPage(){return shell(head('กิจกรรมของคุณ','ประวัติการตรวจสอบ','ค้นหาและดูผลการตรวจสอบข้อความย้อนหลัง')+`<div class="filterbar"><input class="search" id="historySearch" placeholder="⌕  ค้นหารหัสหรือข้อความ..." oninput="filterHistory()"><select class="select" id="historyStatus" onchange="filterHistory()"><option value="">ทุกผลการตรวจ</option><option>เรียบร้อย</option><option>ควรตรวจสอบ</option><option>พบคำไม่เหมาะสม</option></select><select class="select"><option>ทุกหมวดหมู่</option><option>คำหยาบคาย</option><option>ความก้าวร้าว</option></select><button class="button secondary" onclick="exportHistory()">↓ ส่งออก</button></div><div class="table-card" id="historyTable">${table(records)}<div class="pagination"><span>แสดง 1–${records.length} จาก ${records.length} รายการ</span><div class="pages"><button>‹</button><button class="active">1</button><button>2</button><button>3</button><button>›</button></div></div></div>`)}
function managePage(){return shell(head('เครื่องมือผู้ดูแล','จัดการคำไม่เหมาะสม','เพิ่ม แก้ไข และจัดหมวดหมู่คำสำหรับใช้ในการตรวจสอบ',`<button class="button primary" onclick="addWord()">＋ เพิ่มคำใหม่</button>`)+`<section class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="stat-top">คำทั้งหมด <span class="stat-icon purple">▤</span></div><div class="stat-value">${words.length}</div><div class="stat-foot">รายการในฐานข้อมูล</div></div><div class="card"><div class="stat-top">เปิดใช้งาน <span class="stat-icon green">✓</span></div><div class="stat-value">${words.filter(w=>w[3]==='ใช้งาน').length}</div><div class="stat-foot">คำที่ใช้ตรวจสอบอยู่</div></div><div class="card"><div class="stat-top">หมวดหมู่ <span class="stat-icon orange">◈</span></div><div class="stat-value">4</div><div class="stat-foot">หมวดหมู่ที่กำหนดไว้</div></div></section><div class="filterbar"><input class="search" id="wordSearch" placeholder="⌕  ค้นหาคำ..." oninput="renderWords()"><select class="select"><option>ทุกหมวดหมู่</option><option>คำหยาบคาย</option><option>ดูหมิ่น</option><option>ความรุนแรง</option></select><select class="select"><option>ทุกสถานะ</option><option>ใช้งาน</option><option>ปิดใช้งาน</option></select></div><div class="table-card" id="wordTable">${wordTable()}</div><div style="font-size:9px;color:#a0a5b4;margin:12px 4px">⚠ การจัดการคำมีผลต่อผลการวิเคราะห์ข้อความทั้งหมด กรุณาตรวจสอบก่อนบันทึก</div>`)}
function settingsPage(){let s={};try{s=JSON.parse(localStorage.getItem('cleartalk.settings.v1')||'{}')}catch{};return shell(head('ปรับแต่งการใช้งาน','ตั้งค่าระบบ','จัดการรูปแบบการตรวจสอบและข้อมูลที่บันทึกในเบราว์เซอร์')+`<div class="workspace"><section class="panel"><h3>ตัวเลือกการตรวจสอบ</h3><p class="panel-sub">กำหนดหมวดหมู่ที่เลือกไว้ล่วงหน้าในหน้าตรวจข้อความ</p><div style="display:grid;gap:11px;margin:18px 0 22px">${[['คำหยาบคาย','ตรวจหาคำหยาบคายและถ้อยคำไม่สุภาพ','profanity'],['คำดูหมิ่น','ตรวจหาคำดูหมิ่นหรือเหยียดหยาม','insult'],['ความรุนแรง','ตรวจหาถ้อยคำข่มขู่หรือส่งเสริมความรุนแรง','violence'],['สแปม','ตรวจหาข้อความซ้ำหรือโฆษณารบกวน','spam'],['ตรวจจับน้ำเสียง','แสดงคำแนะนำเรื่องน้ำเสียงของข้อความ','tone']].map(([title,sub,key])=>`<label style="display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px"><span><b style="font-size:11px">${title}</b><small style="display:block;color:var(--muted);font-size:9px;margin-top:4px">${sub}</small></span><input type="checkbox" class="setting-check" data-setting="${key}" ${s[key]!==false?'checked':''} style="accent-color:var(--purple);width:16px;height:16px"></label>`).join('')}</div><button class="button primary" onclick="saveSettings()">บันทึกการตั้งค่า</button></section><aside><div class="aside-card"><h4>ข้อมูลในเบราว์เซอร์นี้</h4><div class="activity-row"><span>ประวัติการตรวจสอบ</span><b>${records.length} รายการ</b></div><div class="activity-row"><span>รายการคำ</span><b>${words.length} คำ</b></div><p style="font-size:9px;line-height:1.7;color:var(--muted)">ข้อมูลจะอยู่ในเบราว์เซอร์และอุปกรณ์ที่ใช้งานนี้</p><button class="button secondary" style="width:100%" onclick="exportData()">↓ ดาวน์โหลดข้อมูล JSON</button></div><div class="aside-card"><h4>เกี่ยวกับ ClearTalk</h4><p style="font-size:10px;line-height:1.8;color:var(--muted);margin:0">เวอร์ชันต้นแบบ · การวิเคราะห์ใช้การจับคู่คำจากรายการคำในระบบ ผลลัพธ์อาจไม่เข้าใจบริบททั้งหมด</p></div></aside></div>`)}
function saveSettings(){let s={};document.querySelectorAll('.setting-check').forEach(c=>s[c.dataset.setting]=c.checked);localStorage.setItem('cleartalk.settings.v1',JSON.stringify(s));if(window.clearTalkSave)window.clearTalkSave();showToast('บันทึกการตั้งค่าแล้ว')}
function exportData(){let payload={exportedAt:new Date().toISOString(),records,words,settings:JSON.parse(localStorage.getItem('cleartalk.settings.v1')||'{}')};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='cleartalk-data.json';a.click();URL.revokeObjectURL(a.href);showToast('ดาวน์โหลดข้อมูลแล้ว')}
function wordTable(){return `<table class="table"><thead><tr><th>คำ / วลี</th><th>หมวดหมู่</th><th>ระดับความรุนแรง</th><th>สถานะ</th><th>เพิ่มเมื่อ</th><th></th></tr></thead><tbody>${words.map((w,i)=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]==='สูง'?'<span class="status flag">สูง</span>':w[2]==='ปานกลาง'?'<span class="status review">ปานกลาง</span>':'<span class="status clean">ต่ำ</span>'}</td><td>${w[3]==='ใช้งาน'?'<span class="status clean">ใช้งาน</span>':'<span class="status review">ปิดใช้งาน</span>'}</td><td>16 มี.ค. 2025</td><td><button class="button secondary" style="padding:6px 9px;font-size:9px" onclick="toggleWord(${i})">${w[3]==='ใช้งาน'?'ปิดใช้':'เปิดใช้'}</button></td></tr>`).join('')}</tbody></table>`}
function guidePage(){return shell(head('เริ่มต้นใช้งาน','คู่มือการใช้งาน','ขั้นตอนพื้นฐานสำหรับใช้ ClearTalk')+`<section class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:18px"><article class="card"><div class="stat-icon purple">1</div><h3>ตรวจข้อความ</h3><p class="stat-foot">เลือกเมนู “ตรวจสอบข้อความ” วางหรือพิมพ์ข้อความ แล้วกดปุ่มตรวจสอบ</p></article><article class="card"><div class="stat-icon green">2</div><h3>อ่านผลอย่างรอบคอบ</h3><p class="stat-foot">ระบบแจ้งคำที่ตรงกับรายการตรวจสอบ ผลลัพธ์เป็นตัวช่วยเบื้องต้นและอาจไม่เข้าใจบริบททั้งหมด</p></article><article class="card"><div class="stat-icon orange">3</div><h3>ย้อนดูประวัติ</h3><p class="stat-foot">เปิดเมนู “ประวัติการตรวจสอบ” เพื่อค้นหาและทบทวนรายการที่เคยตรวจ</p></article></section><section class="card"><h3>สิทธิ์การใช้งาน</h3><p class="stat-foot">ผู้ใช้ทั่วไปตรวจข้อความและดูประวัติได้ ส่วนผู้ดูแลระบบจัดการรายการคำและตั้งค่าระบบได้</p></section>`)}
function authPage(which){let reg=which==='register';return `<div class="auth-shell"><section class="auth-card"><div class="auth-logo"><div class="brand-mark">✳</div>ClearTalk</div><div class="eyebrow">${reg?'เริ่มต้นใช้งาน':'ยินดีต้อนรับกลับ'}</div><h1>${reg?'สร้างบัญชีใหม่':'เข้าสู่ระบบ'}</h1><p>${reg?'สมัครสมาชิกเพื่อเริ่มตรวจสอบข้อความและดูประวัติของคุณ':'กรอกข้อมูลเพื่อเข้าสู่ระบบ ClearTalk ของคุณ'}</p>${reg?`<div class="field"><label>ชื่อที่ใช้แสดง</label><input placeholder="เช่น ชื่อ นามสกุล"></div>`:''}<div class="field"><label>อีเมล</label><input type="email" placeholder="name@example.com"></div><div class="field"><label>รหัสผ่าน</label><input type="password" placeholder="${reg?'อย่างน้อย 8 ตัวอักษร':'กรอกรหัสผ่านของคุณ'}"></div>${reg?`<div class="field"><label>ยืนยันรหัสผ่าน</label><input type="password" placeholder="กรอกรหัสผ่านอีกครั้ง"></div>`:`<div style="display:flex;justify-content:space-between;font-size:10px;color:#858b9d;margin:4px 0 9px"><label><input type="checkbox" style="accent-color:#6856dc"> จดจำฉัน</label><a href="#" onclick="showToast('กรุณาติดต่อผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่าน')" style="color:var(--purple)">ลืมรหัสผ่าน?</a></div>`}<button class="button primary" onclick="authSubmit(${reg})">${reg?'สมัครสมาชิก':'เข้าสู่ระบบ'} →</button><div class="auth-switch">${reg?'มีบัญชีอยู่แล้ว?':'ยังไม่มีบัญชี?'} <a href="#" onclick="navigate('${reg?'login':'register'}');return false">${reg?'เข้าสู่ระบบ':'สมัครสมาชิก'}</a></div><div style="text-align:center;font-size:9px;color:#a3a7b5;margin-top:22px">การใช้งานแสดงว่าคุณยอมรับข้อกำหนดและนโยบายความเป็นส่วนตัว</div></section></div>`}
function render(){document.getElementById('crumb').textContent=names[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,check:checkPage,history:historyPage,manage:managePage,settings:settingsPage,login:()=>authPage('login'),register:()=>authPage('register')};document.getElementById('view').innerHTML=views[page]();document.getElementById('sidebar').classList.remove('open');if(page==='check'){let input=document.getElementById('message');input.addEventListener('input',()=>document.getElementById('charCount').textContent=input.value.length)}}
const renderWithGuide=render;render=function(){if(page!=='guide')return renderWithGuide();document.getElementById('crumb').textContent=names[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('view').innerHTML=guidePage();document.getElementById('sidebar').classList.remove('open')};
function navigate(p){if(p==='login'||p==='register'){location.href=p==='login'?'login.html':'register.html';return}page=p;render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('sidebar').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});
function showToast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2400)}
function analyze(){let v=document.getElementById('message').value.trim();if(!v){showToast('กรุณาพิมพ์ข้อความที่ต้องการตรวจสอบก่อน');return}let terms=['หยาบคาย','โง่','ไอ้บ้า','ข่มขู่'];let found=terms.filter(w=>v.includes(w));let safe=!found.length;let out=safe?`<div class="result-head"><strong>ผลการวิเคราะห์</strong>${status('เรียบร้อย')}</div><div class="result-text">ไม่พบคำที่อยู่ในรายการตรวจสอบ ข้อความนี้ดูเหมาะสมในระดับเบื้องต้น</div><div class="result-tags"><span class="tag">ความเสี่ยงต่ำ</span><span class="tag">ความมั่นใจ 94%</span></div>`:`<div class="result-head"><strong>ผลการวิเคราะห์</strong>${status('พบคำไม่เหมาะสม')}</div><div class="result-text">พบคำที่ควรพิจารณา: ${found.map(w=>`<span class="highlight">${w}</span>`).join('、')}<br>ข้อความมีถ้อยคำที่อาจส่งผลกระทบต่อผู้อ่าน กรุณาพิจารณาปรับแก้</div><div class="result-tags">${found.map(w=>`<span class="tag">${w}</span>`).join('')}<span class="tag">ความมั่นใจ 91%</span></div>`;let r=document.getElementById('result');r.innerHTML=out;r.classList.add('show');let label=safe?'เรียบร้อย':'พบคำไม่เหมาะสม';records.unshift([`CT-${Date.now().toString().slice(-8)}`,'เมื่อสักครู่',v,found.length?'คำที่ควรพิจารณา':'ทั่วไป',label]);showToast('ตรวจสอบข้อความเสร็จแล้ว')}
function exportHistory(){const rows=[['ID','Date / time','Message','Category','Result'],...records];const csv=rows.map(row=>row.map(value=>'"'+String(value??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='cleartalk-history.csv';link.click();URL.revokeObjectURL(url);showToast('CSV downloaded')}
function filterHistory(){let q=document.getElementById('historySearch').value.toLowerCase(),s=document.getElementById('historyStatus').value;let rows=records.filter(r=>(r.join(' ').toLowerCase().includes(q))&&(!s||r[4]===s));document.getElementById('historyTable').innerHTML=rows.length?`${table(rows)}<div class="pagination"><span>แสดง ${rows.length} รายการ</span><div class="pages"><button class="active">1</button><button>›</button></div></div>`:`<div class="empty">ไม่พบรายการที่ตรงกับการค้นหา</div>`}
function addWord(){let w=prompt('กรอกคำหรือวลีที่ต้องการเพิ่ม:');if(w&&w.trim()){words.unshift([w.trim(),'คำที่เพิ่มใหม่','ปานกลาง','ใช้งาน']);render();showToast('เพิ่มคำใหม่แล้ว')}}function toggleWord(i){words[i][3]=words[i][3]==='ใช้งาน'?'ปิดใช้งาน':'ใช้งาน';render();showToast('อัปเดตสถานะคำแล้ว')}function renderWords(){let q=document.getElementById('wordSearch').value.toLowerCase();let match=words.filter(w=>w.join(' ').toLowerCase().includes(q));document.getElementById('wordTable').innerHTML=wordTableFiltered(match)}function wordTableFiltered(list){if(!list.length)return '<div class="empty">ไม่พบคำที่ค้นหา</div>';return `<table class="table"><thead><tr><th>คำ / วลี</th><th>หมวดหมู่</th><th>ระดับความรุนแรง</th><th>สถานะ</th><th>เพิ่มเมื่อ</th><th></th></tr></thead><tbody>${list.map(w=>{let i=words.indexOf(w);return `<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]==='สูง'?'<span class="status flag">สูง</span>':w[2]==='ปานกลาง'?'<span class="status review">ปานกลาง</span>':'<span class="status clean">ต่ำ</span>'}</td><td>${w[3]==='ใช้งาน'?'<span class="status clean">ใช้งาน</span>':'<span class="status review">ปิดใช้งาน</span>'}</td><td>16 มี.ค. 2025</td><td><button class="button secondary" style="padding:6px 9px;font-size:9px" onclick="toggleWord(${i})">${w[3]==='ใช้งาน'?'ปิดใช้':'เปิดใช้'}</button></td></tr>`}).join('')}</tbody></table>`}function setInputMode(btn,mode){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');let a=document.getElementById('message');a.placeholder=mode==='url'?'วางลิงก์ URL ที่ต้องการตรวจสอบ...\n\nหมายเหตุ: ต้นแบบนี้ตรวจสอบได้เฉพาะข้อความที่วางด้วยตนเอง':''}
function authSubmit(reg){showToast(reg?'สมัครสมาชิกสำเร็จ (ตัวอย่าง)':'เข้าสู่ระบบสำเร็จ (ตัวอย่าง)');setTimeout(()=>navigate('dashboard'),700)}
render();
</script>
