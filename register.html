<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก — ClearTalk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="larger-text.css">  <link rel="stylesheet" href="mobile.css">
</head>
<body><main class="auth"><div class="brand"><div class="mark">✳</div>ClearTalk</div><div class="eyebrow">เริ่มต้นใช้งาน</div><h1>สร้างบัญชีใหม่</h1><p class="intro">สมัครสมาชิกเพื่อเข้าใช้ระบบและบันทึกประวัติการตรวจสอบ</p><form id="auth-form" data-mode="register"><div class="field"><label for="name">ชื่อที่ใช้แสดง</label><input id="name" name="name" autocomplete="name" placeholder="ชื่อของคุณ" maxlength="80" required></div><div class="field"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label for="password">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm">ยืนยันรหัสผ่าน</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="submit" type="submit">สมัครสมาชิก</button><div id="notice" class="notice" role="status"></div></form><div class="switch">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></div><div class="fine">รหัสผ่านจะถูกจัดเก็บเป็นค่าแฮชในฐานข้อมูล</div></main><script src="auth.js"></script></body></html>
