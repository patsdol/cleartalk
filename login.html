<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ — ClearTalk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="larger-text.css"></head>
<body><main class="auth"><div class="brand"><div class="mark">✳</div>ClearTalk</div><div class="eyebrow">ยินดีต้อนรับกลับ</div><h1>เข้าสู่ระบบ</h1><p class="intro">กรอกอีเมลและรหัสผ่านเพื่อเข้าสู่ระบบตรวจสอบข้อความ</p><form id="auth-form" data-mode="login"><div class="field"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="รหัสผ่านของคุณ" required></div><button class="submit" type="submit">เข้าสู่ระบบ</button><div id="notice" class="notice" role="status"></div></form><a class="register-cta" href="register.html">＋ สมัครสมาชิกใหม่</a><div class="fine">บัญชีที่สมัครจะถูกเก็บในฐานข้อมูลของเซิร์ฟเวอร์เครื่องนี้</div></main><script src="auth.js"></script></body></html>
